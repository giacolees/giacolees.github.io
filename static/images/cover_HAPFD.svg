<svg xmlns="http://www.w3.org/2000/svg" width="2752" height="1200" viewBox="0 0 2752 1200">
  <rect width="2752" height="1200" fill="#1b170b"/>
  <g fill="none" stroke="#ece0c6" stroke-linecap="round" stroke-linejoin="round">
